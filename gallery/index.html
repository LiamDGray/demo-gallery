<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Gallery — LiamDGray</title>
<style>
  :root { --bg: #0d1117; --fg: #e6edf3; --accent: #58a6ff; --border: #30363d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
         background: var(--bg); color: var(--fg); line-height: 1.6; padding: 2rem; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #f0f6fc; }
  h1 small { font-size: 1rem; color: #8b949e; font-weight: 400; }
  p.sub { color: #8b949e; margin-bottom: 2rem; }
  .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
  .card { background: #161b22; border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; }
  .card h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
  .card h2 a { color: var(--accent); text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .card p { font-size: 0.875rem; color: #8b949e; margin-bottom: 0.75rem; }
  .tag { display: inline-block; font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 4px;
         background: #1f2937; color: #9ca3af; margin-right: 0.25rem; }
  .tag.ready { background: #0f3b1e; color: #3fb950; }
  .tag.build { background: #3b1f0f; color: #d29922; }
  .status { color: #8b949e; font-size: 0.8rem; }
  .landing { text-align: center; padding: 4rem 0; }
  .landing h1 { font-size: 3rem; }
  .token-form { background: #161b22; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin: 2rem 0; }
  .token-form h3 { margin-bottom: 1rem; }
  .token-form label { display: block; margin: 0.5rem 0 0.25rem; color: #8b949e; }
  .token-form input, .token-form select { width: 100%; padding: 0.5rem; background: #0d1117;
         border: 1px solid var(--border); border-radius: 4px; color: var(--fg); }
  .token-form button { margin-top: 1rem; padding: 0.5rem 1.5rem; background: #238636;
         color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .token-form button:hover { background: #2ea043; }
  .token-result { background: #0d1117; border: 1px solid #238636; border-radius: 4px; padding: 0.75rem;
                  margin-top: 1rem; word-break: break-all; display: none; }
</style>
</head>
<body>

<div class="landing" id="landing">
  <h1>Demo Gallery <small>β</small></h1>
  <p class="sub">Live demos of projects by LiamDGray — time-limited access for prospective clients.</p>
  <p class="sub">← You need a token. If you're a client, check your email.</p>
</div>

<div class="token-form" id="token-form">
  <h3>🔑 Enter Access Token</h3>
  <label for="token-input">Paste the token from your invitation link</label>
  <input type="text" id="token-input" placeholder="Paste your token URL or just the token..." />
  <button onclick="redeemToken()">Access Demos</button>
  <div id="token-error" style="color:#f85149;margin-top:0.5rem;display:none;"></div>
</div>

<div id="demos" style="display:none;">
  <h2 style="margin-bottom:1rem;">Available Demos</h2>
  <div class="demo-grid" id="demo-grid"></div>
</div>

<script>
  const DEMOS = [
    { id: 'geo-csg',     name: 'GeoCSG',         desc: 'Photo → editable CAD. 3D scan reconstruction via geometric algebra.',             status: 'ready', tags: ['FastAPI', 'SaaS'] },
    { id: 'voice-chat',  name: 'Voice Chat',     desc: 'WebSocket voice interface PWA — push-to-talk or VAD with TTS.',                   status: 'ready', tags: ['PWA', 'WebSocket'] },
    { id: 'realpeep',    name: 'RealPeep',       desc: 'Anonymous provenance & mesh consensus — ZK identity, hash chains.',               status: 'build', tags: ['Dashboard', 'ZK'] },
    { id: 'name-check',  name: 'Name Check',     desc: 'Check domain + USPTO trademark conflicts for your product idea.',                   status: 'ready', tags: ['Utility'] },
    { id: 'afterlife',   name: 'Afterlife',      desc: 'x402 micropayment proxy vending. Pay-per-use proxies with Ed25519 leases.',        status: 'build', tags: ['Payments'] },
    { id: 'artcall',     name: 'ArtCall',        desc: 'Self-healing scrapers for artist grant/residency calls.',                           status: 'ready', tags: ['Scraping'] },
    { id: 'agent-debate',name: 'Agent Debate',   desc: 'Multi-round structured debates between two AI perspectives.',                       status: 'ready', tags: ['MCP', 'LLM'] },
    { id: 'behavioral',  name: 'Behavioral Mim.', desc: 'Record your browsing, compute behavioral distributions, sample at automation time.', status: 'build', tags: ['Analysis'] },
    { id: 'sigstead',    name: 'Sigstead',       desc: 'Cryptographic provenance for AI agent decisions.',                                  status: 'ready', tags: ['Security'] },
    { id: 'loc3net',     name: 'Loc3Net',        desc: 'Turn your phone into a residential IP exit node for cloud agents.',                 status: 'build', tags: ['Networking'] },
  ];

  function getToken() {
    const params = new URLSearchParams(window.location.search);
    return params.get('token') || '';
  }

  function renderDemos(token) {
    const grid = document.getElementById('demo-grid');
    grid.innerHTML = DEMOS.map(d => `
      <div class="card">
        <h2><a href="/${d.id}?token=${token}" target="_blank">${d.name}</a></h2>
        <p>${d.desc}</p>
        <div>
          <span class="tag ${d.status}">${d.status === 'ready' ? '⭐ Ready' : '🔨 Building'}</span>
          ${d.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
    `).join('');
    document.getElementById('demos').style.display = 'block';
    document.getElementById('token-form').style.display = 'none';
    document.getElementById('landing').style.display = 'none';
  }

  function redeemToken() {
    const input = document.getElementById('token-input').value.trim();
    const err = document.getElementById('token-error');
    // Try to extract token from URL, or use raw token
    let token;
    try {
      const url = new URL(input);
      token = url.searchParams.get('token') || input;
    } catch {
      token = input;
    }
    if (!token) {
      err.textContent = 'Please enter a token.';
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    renderDemos(token);
  }

  // Auto-redeem if token in URL
  const initialToken = getToken();
  if (initialToken) {
    document.getElementById('token-input').value = initialToken;
    renderDemos(initialToken);
  }
</script>
</body>
</html>
